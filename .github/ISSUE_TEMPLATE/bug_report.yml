name: 🐞 Bug report
description: Report reproducible incorrect behavior in MegaLM
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I am using the latest release or the current `main` branch.
          required: true
        - label: I can provide a minimal reproduction and environment details below.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Include the exact command / server flags and request payload, plus the
        model and adapter involved. Attach the full traceback or server log if
        possible (redact secrets and personal data).
      placeholder: |
        megalm-server --model ... --dtype bfloat16 ...
        curl http://localhost:8000/v1/chat/completions -d '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide: OS, GPU model and driver, CUDA version, Python version,
        MegaLM version/commit, TensorPlay version, and how you installed it.
      placeholder: |
        MegaLM: 0.2.0 (commit ...)
        Python: 3.12.x, CUDA: 12.x, GPU: RTX 3090
        TensorPlay: 1.3.x, install: pip install -e .
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround / additional context
      description: Anything else that may help, including a workaround you found.
