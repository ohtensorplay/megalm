name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # tensorplay dev wheels live on this index, not on PyPI.
      PIP_EXTRA_INDEX_URL: ${{ vars.PIP_EXTRA_INDEX_URL || secrets.PIP_EXTRA_INDEX_URL || 'https://download.tensorplay.cn/simple' }}
      # The index also publishes +cu/+maca wheels with the same version. Pin
      # the CPU build: this job has no GPU and the other wheels ship a
      # different libruntime_*.so and fail at import time.
      TENSORPLAY_SPEC: ${{ vars.TENSORPLAY_SPEC || secrets.TENSORPLAY_SPEC || 'tensorplay==1.4.0.dev20261124+cpu' }}
      # The native extension is a local build artifact, not checked in. pip
      # builds it into site-packages, so the source-tree freshness guard is
      # not applicable here.
      MEGALM_SKIP_SO_FRESHNESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install MegaLM with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "$TENSORPLAY_SPEC"
          python -m pip install -e ".[test]"
      - name: pytest
        run: python -m pytest tests -q

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pin 3.13: PyO3 0.22's build script rejects the runner's Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --locked
      # The root package gate above does not run workspace member tests.  Run
      # the benchmark crate explicitly, including the mock-SSE end-to-end
      # tests that need no GPU or external network.
      - name: serving benchmark tests
        run: cargo test --manifest-path rust/Cargo.toml --locked -p megalm-bench
      # Validate the seeded workload builder and CLI without a server.
      - name: serving benchmark CLI smoke
        run: cargo run --manifest-path rust/Cargo.toml --locked -p megalm-bench -- serve --model smoke --dry-run --num-prompts 2
      # Criterion's --test mode executes every benchmark once without timing.
      # It is a cheap gate that keeps benchmark code compiling and runnable;
      # performance regressions are tracked separately with saved baselines.
      - name: benchmark smoke gate
        run: cargo bench --manifest-path rust/Cargo.toml --locked --bench parsers -- --test
