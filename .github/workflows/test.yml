name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install MegaLM with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: pytest
        run: python -m pytest tests -q

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --locked
      # Criterion's --test mode executes every benchmark once without timing.
      # It is a cheap gate that keeps benchmark code compiling and runnable;
      # performance regressions are tracked separately with saved baselines.
      - name: benchmark smoke gate
        run: cargo bench --manifest-path rust/Cargo.toml --locked --bench parsers -- --test
