[package]
name = "megalm-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust OpenAI-compatible frontend for MegaLM"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
tracing = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = { workspace = true }
libc = { workspace = true }
subtle = { workspace = true }
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
megalm-rs = { path = "../.." }
megalm-tokenizer = { workspace = true }
megalm-engine-client = { workspace = true }
megalm-protocol = { workspace = true }
