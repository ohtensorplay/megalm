[package]
name = "megalm-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust accelerator layer for the MegaLM gateway host paths"

[lib]
name = "megalm_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "parsers"
harness = false

[profile.release]
lto = true
codegen-units = 1
